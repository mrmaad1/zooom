# Fly.io deployment for the all-in-one app (WebSockets supported).
#   fly launch --no-deploy   then   fly deploy
app = "zooom"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  MAX_PARTICIPANTS = "24"
  ALLOW_PUBLIC_STUN = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
